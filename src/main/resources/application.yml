server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tasks}
    username: ${DB_USER:tasks}
    password: ${DB_PASSWORD:tasks}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 3600000
management:
  endpoints:
    web:
      exposure:
        include: health,info
